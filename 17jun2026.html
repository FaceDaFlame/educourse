<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background-color: #e8dfc8;
            width: 90%;
            max-width: 600px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: center;
        }

        .foto-profile {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #ccc;
            margin: 0 auto;
            color: #e8dfc8;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
        }

        .status {
            color: #888;
            font-weight: bold;
        }
        
        @media (min-width: 768px) {
            .card {
                flex-direction: row;
                text-align: left;
                align-items: center;
            }
        }
        
    </style>
</head>
<body>
    <div class="card">
        <div class="foto-profile">
        Foto
    </div>

    <div class="konten-profile">
        <h2>Nama Lengkap</h2>
        <p class="status">Siswa SIJA 3</p>
        <p class="desc">Halo, saya seorang siswa SIJA 3</p>
    </div>
</body>
</html>
