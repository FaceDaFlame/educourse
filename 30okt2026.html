<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neyflix by Tegar</title>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<style>

    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #141414;
        color: #fff;
        margin: 0;
    }

    .container {
        max-width: 960px;
        margin: 0 auto;
        padding: 48px 20px;
    }

    h2 {
        color: #e50914;
        font-size: 30px;
        margin: 0 0 6px;
    }

    p {
        color: #9a9a9a;
        font-size: 14px;
        margin: 0 0 24px;
    }

    input {
        width: 100%;
        padding: 14px 16px;
        background-color: #222;
        border: 1px solid #333;
        border-radius: 4px;
        color: #fff;
        font-size: 16px;
        outline: none;
        transition: border-color 0.2s;
    }

    input::placeholder {
        color: #777;
    }

    input:focus {
        border-color: #e50914;
    }

    .movie-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 20px;
        margin-top: 28px;
    }


    .movie-grid > p {
        grid-column: 1 / -1;
        margin: 0;
    }

    .movie-card {
        background-color: #1f1f1f;
        border-radius: 4px;
        overflow: hidden;
        transition: transform 0.25s ease;
    }

    .movie-card:hover {
        transform: scale(1.04);
        z-index: 1;
    }

    .movie-card img {
        display: block;
        width: 100%;
        aspect-ratio: 2 / 3;
        object-fit: cover;
        background-color: #2a2a2a;
    }

    .movie-info {
        padding: 10px 12px 12px;
    }

    .movie-title {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.3;
        color: #e5e5e5;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

</style>
</head>
<body>
    
    <div class="container">
        <h2>Netflix by Wisnu</h2>
        <p>Cari Film Favoritmu Sekarang</p>

        <input type="text" id="searchBox" placeholder="Cari FIlm... (Naruto, One Piece, Jujutsu Kaisen)">

        <div class="movie-grid" id="movieGrid"></div>


    </div>

    <script>

        $(document).ready(function(){
            $('#searchBox').on('keyup', function(){
                let keyword = $(this).val().trim();

                if (keyword.length <2) {
                    $('#movieGrid').html('');
                    return;
                }

                $('#movieGrid').html('<p>Cari film di server</p>')

                //ambil film dari data umum API
                $.get(`https://api.tvmaze.com/search/shows?q=${keyword}`, function(response){
                    $('#movieGrid').empty();

                    if (response.length > 0) {
                        $.each(response, function(index, item){
                            let show = item.show;
                            let poster = show.image ? show.image.medium: 'https://via.placeholder.com/150?text=No+Image'

                            let card = `
                            <div class="movie-card">
                                <img src="${poster}" alt="poster">
                                <div class ="movie-info">
                                    <h4 class = "movie-title">${show.name}
                                </div>
                            <div>
                                `;
                                $('#movieGrid').append(card);
                        })
                    }
                })
            })
        })

    </script>

</body>
</html>
