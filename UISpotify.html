<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>MP3 Music Player</title>
</head>
<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background-color: #121212; 
  color: #ffffff;
  font-family: Arial, sans-serif;

  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.playing-view {
  width: 350px;
  background-color: #181818;
  border-radius: 12px;
  padding: 20px;
}

.playing {
  display: flex;
  justify-content: center;
  font-size: 12px;
  color: #ffffff;
  margin-bottom: 16px;
  font-weight: bold;
  font-size: 14px;
}

.cover {
  width: 100%;
  aspect-ratio: 1 / 1;
  background-color: #333333;
  border-radius: 10px;
}

.content {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 16px;
}

.content h1 {
  font-size: 16px;
}

.content p {
  font-size: 13px;
  color: #b3b3b3;
  margin-top: 4px;
}

.like {
  background-color: transparent;
  border: 1px solid #555;
  color: #ffffff;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  cursor: pointer;
}

.like.active {
  border-color: #1DB954;
  color: #1DB954;
}

.progress-wrap {
  margin-top: 20px;
}

.progress-bar {
  width: 100%;
  height: 4px;
  background-color: #4d4d4d; 
  border-radius: 2px;
}

.progress-fill {
  height: 100%;
  width: 0%; 
  background-color: #1DB954; 
  border-radius: 2px;
}

.time-row {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: #b3b3b3;
  margin-top: 6px;
}

.controls {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  margin-top: 20px;
}

.controls-center {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
}

.controls-side {
  display: flex;
  align-items: center;
}

.controls-right {
  justify-content: flex-start;
  padding-left: 12px;
}

.ctrl-btn {
  background: none;
  border: none;
  color: #ffffff;
  font-size: 18px;
  cursor: pointer;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;

}

#play-btn {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background-color: #1DB954;
  border: none;
  color: #000000;
  font-size: 18px;
  cursor: pointer;
}

#loop-btn {
  font-size: 22px;
  position: relative;
  top: 2px;
}

#loop-btn.active {
  color: #1DB954;
}

</style>
<body>

<div class="playing-view">
  <div class="playing"><span>Playing View</span></div>

<img class="cover" id="cover" src="" alt="Cover Album">

<audio id="audio-player"></audio>

  <div class="content">
    <div>
      <h1 id="judul-lagu">TIL FURTHER NOTICE</h1>
      <p id="nama-artis">Travis Scott, James Blake, 21 Savage</p>
    </div>
    <button class="like" id="like-btn" title="Suka">♥</button>
  </div>

   <div class="progress-wrap">
    <div class="progress-bar" id="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div class="time-row">
      <span id="time-current">0:00</span>
      <span id="time-total">0:00</span>
    </div>
  </div>
 
  <div class="controls">
    <div class="controls-side"></div>

    <div class="controls-center">
      <button class="ctrl-btn" id="prev-btn" title="Lagu sebelumnya">⏮</button>
      <button id="play-btn" title="Putar/Jeda">▶</button>
      <button class="ctrl-btn" id="next-btn" title="Lagu berikutnya">⏭</button>
    </div>

    <div class="controls-side controls-right">
      <button class="ctrl-btn" id="loop-btn" title="Ulangi lagu">↻</button>
    </div>
  </div>
</div>

<script>

  const songs = [
    {
      title: "TIL FURTHER NOTICE",
      artist: "Travis Scott, James Blake, 21 Savage",
      src: "Travis Scott - TIL FURTHER NOTICE (Official Audio) ft. James Blake, 21 Savage - Travis Scott (128k).mp3",
      cover: "cover.png"
    },
    {
      title: "CIRCUS MAXIMUS",
      artist: "Travis Scott, The Weeknd, Swae Lee",
      src: "Travis Scott - CIRCUS MAXIMUS (Official Audio) ft. The Weeknd, Swae Lee - Travis Scott (128k).mp3",
      cover: "cover.png"
    }
  ];

  let currentIndex = 0;
  let isPlaying = false;

  const playBtn = document.getElementById('play-btn');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');
  const progressFill = document.getElementById('progress-fill');
  const judulEl = document.getElementById('judul-lagu');
  const artisEl = document.getElementById('nama-artis');
  const timeCurrentEl = document.getElementById('time-current');
  const timeTotalEl = document.getElementById('time-total');
  const coverEl = document.getElementById('cover');
  const audio = document.getElementById('audio-player'); 


  function formatTime(totalSeconds) {
    const menit = Math.floor(totalSeconds / 60);
    let detik = Math.floor(totalSeconds % 60);
    detik = detik.toString().padStart(2, "0");
    return menit + ":" + detik;
  }

  
  function loadSong(index) {
    currentIndex = index;
    const song = songs[currentIndex];

    judulEl.textContent = song.title;
    artisEl.textContent = song.artist;
    coverEl.src = song.cover;

    audio.src = song.src; 

    progressFill.style.width = "0%";
    timeCurrentEl.textContent = "0:00";
    timeTotalEl.textContent = "0:00"; 
  }

  
  audio.addEventListener('loadedmetadata', function () {
    timeTotalEl.textContent = formatTime(audio.duration);
  });

  
  audio.addEventListener('timeupdate', function () {
    const persen = (audio.currentTime / audio.duration) * 100;
    progressFill.style.width = persen + "%";
    timeCurrentEl.textContent = formatTime(audio.currentTime);
  });

  
  audio.addEventListener('ended', function () {
    if (currentIndex < songs.length - 1) {
      loadSong(currentIndex + 1);
      audio.play();
    } else {
      isPlaying = false;
      playBtn.textContent = "▶";
    }
  });

  
  playBtn.addEventListener('click', function () {
    isPlaying = !isPlaying;

    if (isPlaying) {
      playBtn.textContent = "⏸";
      audio.play();
    } else {
      playBtn.textContent = "▶";
      audio.pause();
    }
  });

  
  nextBtn.addEventListener('click', function () {
    if (currentIndex < songs.length - 1) {
      loadSong(currentIndex + 1);
      if (isPlaying) audio.play();
    }
  });

  prevBtn.addEventListener('click', function () {
    if (currentIndex > 0) {
      loadSong(currentIndex - 1);
      if (isPlaying) audio.play();
    }
  });

  const loopBtn = document.getElementById('loop-btn');

  loopBtn.addEventListener('click', function () {
  audio.loop = !audio.loop;
  loopBtn.classList.toggle('active');
  });

  const progressBar = document.getElementById('progress-bar');

  progressBar.addEventListener('click', function (e) {
  const rect = progressBar.getBoundingClientRect();
  const klikX = e.clientX - rect.left;      
  const rasio = klikX / rect.width;         

  audio.currentTime = rasio * audio.duration; 
  });

  const likeBtn = document.getElementById('like-btn');

  likeBtn.addEventListener('click', function () {
  likeBtn.classList.toggle('active');
  });

  
  loadSong(0);

</script>

</body>
</html>
