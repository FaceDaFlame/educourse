<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO DO LIST SEDERHANA</title>
    <link rel="stylesheet" href="25sep2026.css">

</head>
<body>
    <h1>MY TASK BOARD</h1>

    <div class="form-container">
        <input type="text" id="inputTask" placeholder="Tulis Tugas Baru">
        <button id="btnTambah">Tambah Tugas</button>
    </div>

    <div class="board">
        <div class="column">
            <h3>Belum Selesai</h3>
            <div id="colTodo"></div>
        </div>
        <div class="column">
            <h3>Selesai</h3>
            <div id="colDone"></div>
        </div>
    </div>

</body>
</html>
