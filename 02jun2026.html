<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox dan grid</title>
    <style>
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: burlywood;
            color: black;
            padding: 15px 20px;
            margin: 15px 20px;
        }

        .menu-links {
            display: flex;
            gap: 20px;
            list-style: none;
            
        }

        .menu-links a {
            text-decoration: none;
            color: black;
        }

    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Contoh Logo</div>
        <ul class="menu-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">History</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
</body>
</html>
