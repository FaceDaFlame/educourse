<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps Detection Simple</title>
    <!-- Perbaikan URL Leaflet CDN (unpkg.com) -->
    <link rel="stylesheet" href="[https://unpkg.com/leaflet@1.9.4/dist/leaflet.css](https://unpkg.com/leaflet@1.9.4/dist/leaflet.css)">
    <script src="[https://unpkg.com/leaflet@1.9.4/dist/leaflet.js](https://unpkg.com/leaflet@1.9.4/dist/leaflet.js)"></script>
    <link href="[https://fonts.googleapis.com/css2?family=Material+Icons](https://fonts.googleapis.com/css2?family=Material+Icons)" rel="stylesheet">
    
    <style>
        body {
            background-color: beige;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 36px;
            align-items: center;
            display: flex;
            flex-direction: column;
        }

        .card {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2b7a78;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .status-box {
            margin-top: 20px;
            padding: 10px;
            background: #ecd476;
            border-radius: 10px;
            text-align: left;
            border: 1px solid #d4b842;
        }

        #map {
            width: 100%;
            height: 300px;
            border-radius: 10px;
            margin-top: 10px;
            border: 1px solid #bdb9b9;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Mencari Lokasiku</h2>
        <p>Tekan tombol di bawah ini</p>

        <button id="btnGPS">Cari posisi sekarang</button>
        <div class="status-box" id="infoStatus">
            Status: <b>Belum Aktif</b><br>
            Latitude/Longitude: -
        </div>

        <div id="map"></div>
    </div>

    <script>
        // 1. Inisialisasi peta awal (Jakarta)
        let map = L.map('map').setView([-6.1751, 106.8650], 13);

        // 2. Mengambil gambar peta dari OpenStreetMap (diperbaiki: L.tileLayer & openstreetmap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="[https://www.openstreetmap.org/copyright](https://www.openstreetmap.org/copyright)">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Variable untuk menampung marker user
        var User = null;

        // 3. Listener Tombol GPS
        document.getElementById('btnGPS').addEventListener('click', function() {
            if (!navigator.geolocation) {
                alert("Browser kamu tidak mendukung akses GPS!");
                return;
            }

            document.getElementById('infoStatus').innerHTML = "Status: <b>Sedang mencari titik lokasi...</b>";

            navigator.geolocation.getCurrentPosition(
                // Callback jika BERHASIL mendapatkan lokasi
                function (position) {
                    let lat = position.coords.latitude;
                    let lng = position.coords.longitude; // Diperbaiki: longitude (bukan longtitude)

                    // Update informasi status di UI
                    document.getElementById('infoStatus').innerHTML = 
                        `Status: <b>Berhasil!</b><br>Latitude/Longitude: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;

                    // Hindari marker ganda
                    if (User) {
                        map.removeLayer(User);
                    }

                    // Pindahkan kamera dan tambahkan marker baru
                    map.setView([lat, lng], 13);
                    User = L.marker([lat, lng]).addTo(map);
                    User.bindPopup("Ini lokasi kamu saat ini!").openPopup();
                },
                // Callback jika GAGAL mendapatkan lokasi
                function(error) {
                    alert("Gagal mendapatkan lokasi! Pastikan izin lokasi/GPS di browser sudah aktif.");
                    document.getElementById('infoStatus').innerHTML = "Status: <b>Gagal mengakses GPS</b>";
                }
            );
        });
    </script>

</body>
</html>
